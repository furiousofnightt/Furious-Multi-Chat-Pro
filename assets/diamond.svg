  <!-- Inner facets for sparkling diamond effect -->
  <polygon points="4,2 8,6 1,6" fill="#ffffff" fill-opacity="0.4" />
  <polygon points="12,2 8,6 15,6" fill="#0088cc" fill-opacity="0.4" />
  <polygon points="8,6 4,2 12,2" fill="#ffffff" fill-opacity="0.6" />
  <polygon points="1,6 8,6 8,14" fill="#ffffff" fill-opacity="0.3" />
  <polygon points="15,6 8,6 8,14" fill="#006699" fill-opacity="0.5" />
</svg>
